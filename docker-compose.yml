services:

  postgres-db:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: todo_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask-app:
    build: .
    container_name: flask-app

    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: todo_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_PORT: 5432

    ports:
      - "5000:5000"

    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
